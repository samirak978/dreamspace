<!DOCTYPE html>
<html>
<head>
  <title>Dreamspace - Daily Planner</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="planner-page">

    <div class="planner-top">
      <button class="back-button" onclick="location.href='index.html'">← Home</button>

      <div>
        <h1>🗓️ My Calendar</h1>
        <p>Plan your week, your way ✨</p>
      </div>

      <button class="add-event-button">＋ Add Event</button>
    </div>

      </div>

          <div class="day-header">
            <span>MON</span>
