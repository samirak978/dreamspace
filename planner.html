<html>
<head>

<div id="event-form" class="event-form">
  <div class="event-form-card">

    <button class="close-event-form" onclick="closeEventForm()">×</button>

    <h2>✨ Add an Event</h2>

    <label>What are you doing?</label>
    <input type="text" id="event-name" placeholder="e.g. Cheer practice">

    <label>Day</label>
    <select id="event-day">
      <option>Monday</option>
      <option>Tuesday</option>
      <option>Wednesday</option>
      <option>Thursday</option>
      <option>Friday</option>
      <option>Saturday</option>
      <option>Sunday</option>
    </select>

    <label>Time</label>
    <select id="event-time">
      <option>8 AM</option>
      <option>9 AM</option>
      <option>10 AM</option>
      <option>11 AM</option>
      <option>12 PM</option>
      <option>1 PM</option>
      <option>2 PM</option>
      <option>3 PM</option>
      <option>4 PM</option>
      <option>5 PM</option>
      <option>6 PM</option>
      <option>7 PM</option>
      <option>8 PM</option>
    </select>

    <button class="save-event-button">Save Event ✨</button>

  </div>
</div>
<script>
function openEventForm() {
  document.getElementById("event-form").style.display = "flex";
}

function closeEventForm() {
  document.getElementById("event-form").style.display = "none";
}

document.querySelector(".save-event-button").addEventListener("click", function() {

  const name = document.getElementById("event-name").value.trim();
  const day = document.getElementById("event-day").value;
  const time = document.getElementById("event-time").value;

  if (name === "") {
    alert("Please enter an event name!");
    return;
  }

  const days = document.querySelectorAll(".calendar-day");

  days.forEach(function(calendarDay) {

    const dayName = calendarDay.querySelector(".day-header span").textContent;

    if (dayName === day.substring(0, 3).toUpperCase()) {

      const times = [
        "8 AM", "9 AM", "10 AM", "11 AM",
        "12 PM", "1 PM", "2 PM", "3 PM",
        "4 PM", "5 PM", "6 PM", "7 PM", "8 PM"
      ];

      const timeIndex = times.indexOf(time);
      const hour = calendarDay.querySelectorAll(".hour")[timeIndex];

      if (hour) {
        const event = document.createElement("div");
        event.className = "calendar-event";
        event.textContent = name;

        hour.appendChild(event);
      }
    }
  });

  document.getElementById("event-name").value = "";
  closeEventForm();
});
</script>

</body>
</html>
