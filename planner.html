<script>
function openEventForm() {
  document.getElementById("event-form").style.display = "flex";
}

function closeEventForm() {
  document.getElementById("event-form").style.display = "none";
}

document.querySelector(".save-event-button").addEventListener("click", function() {

  const name = document.getElementById("event-name").value.trim();
  const day = document.getElementById("event-day").value;
  const start = parseFloat(document.getElementById("event-start").value);
  const end = parseFloat(document.getElementById("event-end").value);
  const color = document.getElementById("event-color").value;
  
  if (name === "") {
    alert("Please enter an event name!");
    return;
  }

  if (end <= start) {
    alert("The end time needs to be after the start time!");
    return;
  }

  const days = document.querySelectorAll(".calendar-day");

  days.forEach(function(calendarDay) {

    const dayName =
      calendarDay.querySelector(".day-header span").textContent;

    if (dayName === day.substring(0, 3).toUpperCase()) {

      const hourRows = calendarDay.querySelectorAll(".hour");

      /*
        Our calendar starts at 8 AM.
        Each hour is 70px tall.
        A half-hour is therefore 35px.
      */

      const top = (start - 7) * 70;
      const height = (end - start) * 70;

      const event = document.createElement("div");

      event.className = "calendar-event";
      event.textContent = name;

      event.style.position = "absolute";
      event.style.top = top + "px";
      event.style.height = height + "px";
      event.style.left = "5px";
      event.style.right = "5px";
      event.style.boxSizing = "border-box";

      calendarDay.appendChild(event);
    }
  });

  document.getElementById("event-name").value = "";

  closeEventForm();
});

</script>
