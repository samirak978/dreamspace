<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <title>My Productivity Website</title>
</head>

<body>

  <h1>✨ My Productivity Hub ✨</h1>
  <p>Welcome! Let's make today a productive one. 💗</p>

  <h2>📝 To-Do List</h2>

<input type="text" id="taskInput" placeholder="Enter a task...">
<button onclick="addTask()">Add Task</button>

<ul id="taskList"></ul>	

  <h2>⏱️ Focus Timer</h2>

<div id="timer">25:00</div>

<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>

  <h2>📅 Daily Planner</h2>

<input type="text" id="planInput" placeholder="What do you want to do today?">
<button onclick="addPlan()">Add to Planner</button>

<ul id="planList"></ul>

<h2>📊 Progress</h2>

<p>Tasks completed: <span id="completedCount">0</span></p>

  <h2>⭐ Rewards</h2>

<p>Points: <span id="points">0</span></p>

<button onclick="addPoints()">Earn 10 Points</button>
<script src="script.js"></script>
</body>
</html>w
